# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/Configuring-Hyprland/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=,preferred,auto,1.25


###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = nautilus  
$menu = rofi -show drun -show-icons -terminal kitty
# $menu = fuzzel


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = waybar & hyprpaper & firefox
exec-once = waybar --config ~/.config/waybar/config_hypr.jsonc --style ~/.config/waybar/style_hypr.css
exec-once = swaync
exec-once = swww-daemon & hyprpaper
exec-once = xremap $HOME/.config/xremap/config.yml
exec-once = hypridle
exec-once = clipse -listen
exec-once = hyprctl setcursor Banana 40
exec-once = kdeconnectd
exec-once = systemctl --user start hyprpolkitagent
# exec-once = OBSIDIAN_USE_WAYLAND=1 obsidian -enable-features=UseOzonePlatform -ozone-platform=wayland  # it is not working well
exec-once = /home/hitmonlee/.local/bin/pypr --debug /tmp/pypr.log


#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,34
env = HYPRCURSOR_SIZE,24
# env = HYPRCURSOR_THEME,macOS
env = WLR_NO_HARDWARE_CURSORS,1
env = HYPRSHOT_DIR,$HOME/Pictures/Screenshots
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# Android emulator
env = _JAVA_AWT_WM_NONREPARENTING, 1
env = QT_QPA_PLATFORM,xcb


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general { 
    gaps_in = 5
    gaps_out = 10

		no_border_on_floating = true

		extend_border_grab_area = 20

    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
		# col.active_border = $color11 #rgb($sapphire) 45deg
  #   col.inactive_border = $color0
    # col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
		col.active_border =  rgba(f9fc3f55) 
		# col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true
		hover_icon_on_border = true

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle

		snap  {
		enabled = true
		}
}


# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 8

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 0.9

		# Now its depricated
    # drop_shadow = true
		# to mimic drop shadow and other shadow related config we need to define them under a sub category named shodow
		shadow {
			enabled = false
			# range = 10
			range = 3
			render_power = 3
			# color = rgba(151a1fee)
			color = rgb(f9fc3f)
			color_inactive = rgb(0,0,0)
		}
		# Now its depricated
    # shadow_range = 30
		# Now its depricated
    # shadow_render_power = 3
		# Now its depricated
    # col.shadow = rgba(151a1fee)

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1
				new_optimizations = on
        
        vibrancy = 0.1696
				xray = 1
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
# animations {
#     enabled = true
#
#     # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more
#
#     bezier = myBezier, 0.05, 0.9, 0.1, 1.05
#
#     animation = windows, 1, 7, myBezier
#     animation = windowsOut, 1, 7, default, popin 80%
#     animation = border, 1, 10, default
#     animation = borderangle, 1, 8, default
#     animation = fade, 1, 7, default
#     animation = workspaces, 1, 6, default
# 		first_launch_animation = true
# }
animations {
    enabled = yes
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 1, 1, 1, 1
    animation = windows, 1, 6, wind, slide
    animation = windowsIn, 1, 6, winIn, slide
    animation = windowsOut, 1, 5, winOut, slide
    animation = windowsMove, 1, 5, wind, slide
    animation = border, 1, 1, liner
    animation = borderangle, 1, 30, liner, loop
    animation = fade, 1, 10, default
    animation = workspaces, 1, 5, wind
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
		smart_split = true
		# NO its depricated
		# no_gaps_when_only = 1 # when there is only one window open disable gaps but border

}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc { 
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}

xwayland {
	force_zero_scaling = true
	use_nearest_neighbor = true
}

render {
	xp_mode = false
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_rules =
    # kb_options = caps:swapescape
    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
				disable_while_typing = true
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
gestures {
    workspace_swipe = true
		workspace_swipe_fingers = 4
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


####################
### KEYBINDINGSS ###
####################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier
$alt = ALT

$browser = zen-browser

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, return, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod,SPACE,togglefloating,
bind = $mainMod, D, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
# bind = $mainMod, J, togglesplit, # dwindle
bind = $SUPER_SHIFT, J, togglesplit, # dwindle
bind = $mainMod, F, fullscreen,

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = , PRINT, exec, bash -c 'hyprshot -m window -f "screenshot_$(date +%Y-%m-%d_%H-%M-%S).png"'
bind = shift, PRINT, exec, bash -c 'hyprshot -m region -f "screenshot_$(date +%Y-%m-%d_%H-%M-%S).png"'
bind = $mainMod, PRINT, exec, $HOME/Scripts/scr_recording.sh
bind = $SUPER_SHIFT, o,exec, hyprlock

# open browser
bind = $alt, b, exec, $browser

bind = $mainMod, h, movefocus, l # Vim key-bindings for window movement
bind = $mainMod, l, movefocus, r # Vim key-bindings for window movement
bind = $mainMod, k, movefocus, u # Vim key-bindings for window movement
bind = $mainMod, j, movefocus, d # Vim key-bindings for window movement

# To move windows using keys
bind = $SUPER_SHIFT, H, movewindow, l
bind = $SUPER_SHIFT, L, movewindow, r
bind = $SUPER_SHIFT, K, movewindow, u
bind = $SUPER_SHIFT, J, movewindow, d 

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# for clipse
bind = $mainMod SHIFT, V, exec, foot --app-id=clipse -e "clipse"
# bind = $mainMod SHIFT, V, exec, kitty --class clipse -e "clipse"
bind = $mainMod SHIFT, N, exec, kitty --class nmtui -e "nmtui"
bind = $mainMod SHIFT, B, exec, foot --app-id=bluetuith -e "bluetuith"

# Pyprland confi
bind = $mainMod,        A, exec, pypr toggle term
bind = $mainMod,V,exec,pypr toggle volume

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule v1
# windowrule = float, ^(kitty)$

# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$
windowrulev2 = float,xray,center,opacity 0.7,pseudo, class:^(clipse)$
windowrulev2 = float,xray,center,opacity 0.7,pseudo, class:^(bluetuith)$
windowrulev2 = float,xray,center,opacity 0.7,pseudo, class:^(nmtui)$
windowrulev2 = float,xray,center,opacity 0.7,pseudo, class:^(xdg-desktop-portal-gtk)$
# windowrule = animation popin, kitty # sets the animation style for kitty
windowrulev2 = opacity 0.8,class:^(waybar)

# layerrules
layerrule = blur, fuzzel
layerrule = xray, fuzzel
layerrule = blur, wofi
layerrule = xray, wofi
layerrule = blur, waybar
layerrule = blur, swww-daemon

# To mimic no_gaps_when_only
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0
windowrulev2 = bordersize 0, floating:0, onworkspace:w[tv1]
windowrulev2 = rounding 0, floating:0, onworkspace:w[tv1]
windowrulev2 = bordersize 0, floating:0, onworkspace:f[1]
windowrulev2 = rounding 0, floating:0, onworkspace:f[1]


windowrulev2 = suppressevent maximize, class:.* # You'll probably like this.
